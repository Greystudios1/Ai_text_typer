name: Build Timekeeper APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Restore Android project payload
        shell: bash
        run: cat timekeeper-payload/part-* | base64 --decode | tar -xz

      - name: Build installable APK with Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "Android SDK was not found on the runner." >&2
            exit 1
          fi

          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          PLATFORM="$(find "$SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-*' | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/aapt2"
          test -x "$BUILD_TOOLS/d8"
          test -f "$PLATFORM/android.jar"

          rm -rf build
          mkdir -p build/classes build/dex

          "$BUILD_TOOLS/aapt2" link \
            -o build/timekeeper-unsigned.apk \
            -I "$PLATFORM/android.jar" \
            --manifest app/src/main/AndroidManifest.xml \
            --min-sdk-version 23 \
            --target-sdk-version 35 \
            -A app/src/main/assets \
            --auto-add-overlay

          javac \
            -source 8 \
            -target 8 \
            -encoding UTF-8 \
            -classpath "$PLATFORM/android.jar" \
            -d build/classes \
            $(find app/src/main/java -name '*.java' -print)

          "$BUILD_TOOLS/d8" \
            --min-api 23 \
            --lib "$PLATFORM/android.jar" \
            --output build/dex \
            $(find build/classes -name '*.class' -print)

          (cd build/dex && zip -q -u ../timekeeper-unsigned.apk classes.dex)

          keytool -genkeypair -noprompt \
            -keystore build/timekeeper-debug.keystore \
            -storepass timekeeper \
            -keypass timekeeper \
            -alias timekeeper \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Timekeeper Debug, OU=Local Build, O=Grey Studios, L=Bristol, ST=Virginia, C=US"

          "$BUILD_TOOLS/zipalign" -f 4 \
            build/timekeeper-unsigned.apk \
            build/timekeeper-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/timekeeper-debug.keystore \
            --ks-pass pass:timekeeper \
            --key-pass pass:timekeeper \
            --out build/Timekeeper-2.1.0.apk \
            build/timekeeper-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/Timekeeper-2.1.0.apk
          unzip -t build/Timekeeper-2.1.0.apk
          sha256sum build/Timekeeper-2.1.0.apk | tee build/Timekeeper-2.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Timekeeper-2.1.0-APK
          path: |
            build/Timekeeper-2.1.0.apk
            build/Timekeeper-2.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 7
